<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate Biometric Report</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef4fb;
      --surface: #ffffff;
      --surface-strong: #f8fbff;
      --text: #111827;
      --muted: #4b5563;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-soft: #e0e7ff;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #f5f7fa;
      color: var(--text);
    }

    body {
      padding: 8px;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .hero {
      padding: 18px 16px 14px;
      background: #f8fafc;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-title {
      max-width: 720px;
    }

    .hero-title h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .hero-title p {
      margin: 8px 0 0;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
      max-width: 100%;
    }

    .hero-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 0;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: none;
    }

    .button--primary {
      color: #ffffff;
      background: var(--accent);
      box-shadow: none;
    }

    .button--primary:hover {
      background: #1d4ed8;
    }

    .button--secondary {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .hero-meta {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .meta-card {
      padding: 10px 12px;
      border-radius: 0;
      background: #ffffff;
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .meta-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .meta-card span {
      display: block;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
    }

    .table-wrap {
      padding: 4px 4px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
      min-width: 980px;
      border: 1px solid rgba(148, 163, 184, 0.22);
    }

    thead th {
      background: #f3f4f6;
      padding: 8 6px;
    }

    th, td {
      padding: 10px 10px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      text-align: left;
      vertical-align: top;
    }

    th {
      font-size: 0.9rem;
      color: #1e3a8a;
      letter-spacing: 0.01em;
      font-weight: 700;
    }

    tbody tr:hover {
      background: transparent;
    }

    tbody tr:nth-child(odd) {
      background: #ffffff;
    }

    tbody tr:nth-child(even) {
      background: #f8fafc;
    }

    td {
      font-size: 0.93rem;
      color: var(--text);
      line-height: 1.4;
    }

    td[data-type="image"] {
      width: 150px;
      max-width: 180px;
    }

    td[data-type="image"] img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      border-radius: 0;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: #f8fafc;
      padding: 4px;
    }

    td.empty {
      color: var(--muted);
      font-style: italic;
      text-align: center;
    }

    .note {
      padding: 0 16px 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    @media (max-width: 960px) {
      .hero {
        padding: 14px 12px 12px;
      }

      .hero-meta {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }

      td[data-type="image"] img {
        height: 120px;
      }
    }

    @media print {
      body {
        padding: 0;
        background: #ffffff;
      }

      .container {
        box-shadow: none;
        border: none;
        border-radius: 0;
      }

      .button, .hero-actions {
        display: none;
      }

      thead th {
        background: #f8fbff;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <div class="hero-top">
        <div class="hero-title">
          <h1>Candidate Biometric Verification Report</h1>
        </div>
      </div>

      <div class="hero-meta">
        <div class="meta-card">
          <strong>Centre</strong>
          <span id="centerName">Srusti Academy of Management</span>
        </div>
        <div class="meta-card">
          <strong>City</strong>
          <span id="cityName">Bhubaneswar</span>
        </div>
        <div class="meta-card">
          <strong>Exam slot</strong>
          <span id="examSlot"></span>
        </div>
        <div class="meta-card">
          <strong>Total candidates</strong>
          <span id="candidateCount">0</span>
        </div>
      </div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Hall Ticket</th>
            <th>Candidate Name</th>
            <th>Signature</th>
            <th>Photo</th>
            <th>Captured Photo</th>
            <th>Captured Thumb</th>
            <th>Capture Timing</th>
          </tr>
        </thead>
        <tbody id="reportBody">
          <tr>
            <td class="empty" colspan="7">Loading report data…</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
</body>
</html>
